# Folder names are looked up under the repository's yolo_datasets.
# Explicit relative paths are relative to this config file.
datasets:
  - other_targets
  - animals_30k_21
output: ../yolo_datasets/merged

# Source numbers follow the order in datasets and start at 1.
reserved_ids: ["2:0-26"]
include_ids: []
compact_ids: false
# Add the same integer to every retained class ID.
id_offset: 0
# Explicit global OLD:NEW mappings, e.g. ["3:10", "5:2"].
id_map: []
copy_images: false
keep_negatives: false
