# Paths are relative to this file, or may be absolute.
# A bare dataset folder name is looked up under the repository's yolo_datasets.
model: ../weights/yolo11n.pt
output: ../runs/batch_train

defaults:
  epochs: 250
  imgsz: 640
  batch: 128
  eval_batch: 32
  workers: 16
  device: 0
  seed: 42
  patience: 50

datasets:
  - data: animals_30k_19
  - data: animals_30k_21
    # Optional overrides for this experiment:
    # params:
    #   batch: 64
    #   fliplr: 0
